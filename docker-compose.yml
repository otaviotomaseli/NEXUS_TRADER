version: '3.8'

services:
  nexus-trader:
    build: .
    container_name: nexus-trader
    ports:
      - "5000:5000"
    volumes:
      - ./instance:/app/instance
      - ./.env:/app/.env
      - ./static/avatars:/app/static/avatars
    environment:
      - FLASK_ENV=production
    restart: unless-stopped

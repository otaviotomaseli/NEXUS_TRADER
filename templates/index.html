<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Trader Automático</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 50px; }
        .bloco { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 400px; margin: 10px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 10px; margin-bottom: 20px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        .resultado { background-color: #e9ecef; border-left: 5px solid #007bff; padding: 15px; }
    </style>
</head>
<body>

    <div class="bloco">
        <h2>Simular Operação</h2>
        <form action="/calcular" method="POST">
            <label>Tipo de Ativo:</label>
            <select name="ativo" required>
                <option value="acao">Ações</option>
                <option value="fii">Fundo Imobiliário</option>
            </select>

            <label>Tipo de Operação:</label>
            <select name="operacao" required>
                <option value="swing_trade">Swing Trade (Dias diferentes)</option>
                <option value="day_trade">Day Trade (Mesmo dia)</option>
            </select>

            <label>Valor Total da Compra (R$):</label>
            <input type="number" step="0.01" name="compra" required placeholder="Ex: 200.00">

            <label>Valor Total da Venda (R$):</label>
            <input type="number" step="0.01" name="venda" required placeholder="Ex: 300.00">

            <button type="submit">Calcular Imposto</button>
        </form>
    </div>

    {% if msg %}
    <div class="bloco resultado">
        <h3>Relatório:</h3>
        <p><strong>Regra:</strong> {{ msg }}</p>
        <p><strong>Lucro da Operação:</strong> R$ {{ "%.2f"|format(lucro) }}</p>
        <p><strong>Imposto a Pagar:</strong> R$ {{ "%.2f"|format(imposto) }}</p>
        <p><strong>Status DARF:</strong> {{ darf }}</p>
        <a href="/">Nova Simulação</a>
    </div>
    {% endif %}

</body>
</html>
